[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schemapulse"
version = "0.1.0"
description = "Streaming JSONL schema lattice inferrer, JSON Schema & TypedDict codegen, and silent data drift detector."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Dharmogata", email = "spectacle2002@gmail.com" }
]
keywords = ["jsonl", "json-schema", "schema-inference", "typeddict", "data-drift", "cli", "codegen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Dharmogata/schemapulse"
Issues = "https://github.com/Dharmogata/schemapulse/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "coverage>=7",
    "ruff>=0.9",
]

[project.scripts]
schemapulse = "schemapulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
